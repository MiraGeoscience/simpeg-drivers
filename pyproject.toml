[build-system]
requires = [
  "poetry-core >=2.2.1",
  "poetry-dynamic-versioning >=1.9.1, ==1.*",
  # list dependencies to work with PIP_NO_DEPS=1
  "MarkupSafe >=2.0",
  "dunamai >=1.25, ==1.*",
  "jinja2 ==3.*",
  "packaging >=24.0",
  "tomlkit >=0.13",
]
build-backend = "poetry_dynamic_versioning.backend"


[project]
name = "simpeg-drivers"
requires-python = ">=3.12, <3.15"

description = "Application to run SimPEG inversions with geoh5 files from Geoscience Analyst."
license = "MIT"
license-files = [
    "LICENSE",
    "docs/THIRD_PARTY_SOFTWARE.md",
]
keywords = [
    "direct current resistivity",
    "earth science",
    "electromagnetics",
    "geoh5",
    "geophysics",
    "geoscience",
    "inverse problems",
    "inversion",
    "modeling",
    "modelling",
    "open science",
    "simpeg",
]
readme = "package.rst"
dynamic = ["version", "classifiers"]
authors = [{ name = "Mira Geoscience", email = "support@mirageoscience.com" }]
maintainers = [
  { name = "Benjamin Kary", email = "benjamink@mirageoscience.com" },
  { name = "Dominique Fournier", email = "dominiquef@mirageoscience.com" }
]

dependencies = [
    # Mira packages
    # "geoh5py @ git+https://github.com/MiraGeoscience/geoh5py.git@release/ga-4.9",
    "geoh5py>=0.14.0b1,<0.15.0",
    # "grid-apps @ git+https://github.com/MiraGeoscience/grid-apps.git@GA-9681",
    "grid-apps>=0.3.0a1.dev1,<0.4.0",
    # "geoapps-utils @ git+https://github.com/MiraGeoscience/geoapps-utils.git@release/ga-4.9",
    "geoapps-utils>=0.8.0b1,<0.9.0",
    # "mira-simpeg[dask] @ git+https://github.com/MiraGeoscience/simpeg.git@release/ga-4.9",
    "mira-simpeg[dask]>=0.26.0.1b1,<0.27.0",
    # other direct dependencies
    "dask>=2026.1.0,<2026.2.0",
    "discretize>=0.12.0,<0.13.0",
    "distributed>=2026.1.0,<2026.2.0",
    "matplotlib>=3.10.4,<3.11.0",
    "numpy>=2.4.2,<2.5.0",
    "openpyxl>=3.1.2,<4.0.0",
    "pandas>=2.3.3,<3.0.0",
    "pydantic>=2.12.0,<2.13.0",
    "pydiso>=0.2.0,<0.3.0",
    "python-mumps==0.0.6.*",
    "rtree>=1.4.0,<1.5.0",
    "scikit-learn>=1.8.0,<1.9.0",
    "scipy>=1.17.0,<1.18.0",
    "tqdm>=4.66.1,<5.0.0",
    "trimesh>=4.1.3,<5.0.0",
]

[project.urls]
repository = "https://github.com/MiraGeoscience/simpeg-drivers"
documentation = "https://mirageoscience-simpeg-drivers.readthedocs-hosted.com/"
homepage = "https://www.mirageoscience.com/mining-industry-software/python-integration/"

[tool.poetry]
requires-poetry = ">=2.2.0,<3.0"

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

packages = [
     { include = "simpeg_drivers" },
     { include = "simpeg_drivers-assets" },
]

include = [
    { path = "simpeg_drivers/_version.py", format = ["sdist", "wheel"] },
]
version = "0.0.0.dev0"

[tool.uv]
# constraints for security
# Transitive security floor, not a direct dependency: GHSA-6q48-6c7w-9gw2
# affects certifi >=2019.3.9,<2026.10.18 (compromised emSign trust chains).
constraint-dependencies = ["certifi>=2026.10.18"]


[dependency-groups]
dev = [
    "Pygments",
    "ipywidgets>=7.6.5,<8.0.0",
    "jupyter-book",
    "jupytext>=1.14,<2.0",
    "pylint>=4.0.9",
    "pytest",
    "pytest-cov",
    "pyyaml",
    "packaging",
    "readthedocs-sphinx-ext",
    "sphinx>=5.0,<6.0",
    "nbconvert>=7.16.4,<7.17.0",
]



[tool.poetry.requires-plugins]
poetry-dynamic-versioning = { version = ">=1.9.1, 1.*", extras = ["plugin"] }

[tool.poetry-dynamic-versioning]
bump = true
enable = true
fix-shallow-repository = true
strict = true
style = "pep440"
vcs = "git"

[tool.poetry-dynamic-versioning.substitution]
files = ["simpeg_drivers/_version.py", "_version.json"]
patterns = [
    '''(^__version__\s*(?::.*?)?=\s*['"])[^'"]*(['"])''',
    '''(^{\s*"version"\s*:\s*")[^"]*("\s*})''',
]

[tool.poetry-dynamic-versioning.files."simpeg_drivers/_version.py"]
persistent-substitution = true
initial-content = """
  __version__ = "0.0.0.dev0"
"""

[tool.poetry-dynamic-versioning.files."_version.json"]
persistent-substitution = true
initial-content = """
{ "version": "0.0.0.dev0" }
"""

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "B028",  # no-explicit-stacklevel for warnings.warn()
    "E501",  # line-too-long - code is reformatted (do not care about comments and docstring)
    "F401",  # unsused-import - covered by pycln
    "RUF005",  # collection-literal-concatenation - wrong suggestion with numpy arrays
    "RUF012", # TODO
]
select = [
    "A",  # flake8-builtins
    "B",  # flake8-bugbear
    "B006",  # Do not use mutable data structures for argument defaults
    "B9",  # flake8-bugbear opiniated warnings
    "BLE",  # flake8-blind-except
    "C4",  # flake8-comprehensions
    "C9",  # mccabe
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "RUF",  # ruff rules
    "TID", # flake8-tidy-imports
    "UP",  # pyupgrade
    "W",  # pycodestyle warnings
]

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.format]
# default formatting is just fine

[tool.mypy]
warn_unused_configs = true
ignore_missing_imports = true
scripts_are_modules = true
show_error_context = true
show_column_numbers = true
check_untyped_defs = true

plugins = [
    "pydantic.mypy"
]

[tool.coverage.run]
branch = true
source = ["simpeg_drivers"]

[tool.coverage.report]
exclude_lines = [
    "raise NotImplementedError",
    "pass",
    "if TYPE_CHECKING",
    "pragma: no cover"
]

fail_under = 85

[tool.coverage.html]
skip_empty = true
skip_covered = true

[tool.pylint.main]
extension-pkg-allow-list = ["numpy", "scipy"]
fail-on = ["F", "E", "W"]
jobs = 0
py-version = "3.12"

[tool.pylint.basic]
good-names = ["i", "j", "k", "x", "y", "z", "ex", "Run", "id", "_"]

[tool.pylint.classes]
defining-attr-methods = ["__init__", "__new__", "setUp", "__post_init__"]
exclude-protected = ["_asdict", "_fields", "_replace", "_source", "_make"]
valid-metaclass-classmethod-first-arg = ["cls"]

[tool.pylint.design]
max-args = 9
max-attributes = 15
max-bool-expr = 6
max-branches = 13
max-locals = 18
max-public-methods = 21
max-statements = 65
min-public-methods = 1

[tool.pylint.imports]
deprecated-modules = ["optparse", "tkinter.tix"]

[tool.pylint."messages control"]
disable = [
    "raw-checker-failed",
    "bad-inline-option",
    "locally-disabled",
    "file-ignored",
    "suppressed-message",
    "useless-suppression",
    "deprecated-pragma",
    "use-symbolic-message-instead",
    "use-implicit-booleaness-not-comparison-to-string",
    "use-implicit-booleaness-not-comparison-to-zero",
    "missing-module-docstring",
    "missing-function-docstring",
    "missing-class-docstring",
    "fixme",
    "R",
    "arguments-differ",
    "arguments-renamed",
    "empty-docstring",
    "import-outside-toplevel",
    "invalid-name",
    "line-too-long",
    "superfluous-parens",
    "ungrouped-imports",
    "unused-import",
    "unused-variable",
    "wrong-import-position",
]
enable = ["c-extension-no-member"]

[tool.pylint.similarities]
min-similarity-lines = 7
