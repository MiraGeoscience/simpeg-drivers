name: Python analysis

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - develop
      - main
      - release/**
      - feature/**
      - hotfix/**
  push:
    branches:
      - develop
      - main
      - release/**
      - feature/**
      - hotfix/**

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  call-workflow-static-analysis:
    name: Static analysis
    uses: MiraGeoscience/CI-tools/.github/workflows/reusable-python-static_analysis.yml@ada36c93a8c58e7eaf49522cb6b5c79c5c47bca2 # GA-9681-pixi-workflow
    permissions:
      contents: read
      pull-requests: read
    with:
      package-manager: 'pixi'
      app-name: 'simpeg_drivers'
      python-version: '3.12'
      pixi-version: 'v0.84.2'
    secrets:
      JFROG_ARTIFACTORY_URL: ${{ secrets.JFROG_ARTIFACTORY_URL }}
      JFROG_ARTIFACTORY_TOKEN: ${{ secrets.JFROG_ARTIFACTORY_TOKEN }}
  call-workflow-pytest:
    name: Pytest
    uses: MiraGeoscience/CI-tools/.github/workflows/reusable-python-pytest.yml@ada36c93a8c58e7eaf49522cb6b5c79c5c47bca2 # GA-9681-pixi-workflow
    permissions:
      contents: read
      pull-requests: read
    with:
      package-manager: 'pixi'
      python-versions: '["3.12", "3.13", "3.14"]'
      pixi-version: 'v0.84.2'
      pixi-setup-task: 'install'
      os: '["ubuntu-latest", "windows-latest"]'
      cache-number: 1
      codecov-reference-python-version: '3.12'
      codecov-reference-os: '["ubuntu-latest"]'
      timeout-minutes: 40
    secrets:
      JFROG_ARTIFACTORY_URL: ${{ secrets.JFROG_ARTIFACTORY_URL }}
      JFROG_ARTIFACTORY_TOKEN: ${{ secrets.JFROG_ARTIFACTORY_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
