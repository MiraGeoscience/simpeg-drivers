[project]
name = "simpeg-drivers"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]

[tasks]
install-dev = "pip install --no-deps --editable ."

[dependencies]
python = ">=3.10,<4.0"
# Git dependencies
pip = "*"
# Standard dependencies
dask-core = ">=2025.3,<2025.4"
discretize = "0.11.*"
distributed = ">=2025.3,<2025.4"
numpy = "~1.26.0"
pydantic = "2.11.*"
rtree = "~1.2.0"
scikit-learn = "~1.6.0"
scipy = "~1.14.0"
tqdm = ">=4.66.1,<5.0"
trimesh = "~4.1.3"
# Simpeg solvers
pydiso = ">=0.1.0,<0.2"
python-mumps = ">=0.0.3,<0.0.4"
# BLAS implementation
libblas = "*=*mkl"
# Force indirect dependencies through conda
bokeh = ">=3.6.0,<3.7"
fsspec = ">=2022.0"
geoana = ">=0.7.0,<0.8"
h5py = ">=3.2.1,<4.0"
matplotlib-base = ">=3.8.4,<3.9"
mkl = ">=2024.2.2"
pillow = ">=10.3.0,<10.4"
pymatsolver = ">=0.3.0,<0.4"
zarr = ">=2.14.2,<2.15"

[feature.dev.dependencies]
# Development dependencies
pygments = "*"
ipywidgets = ">=7.6.5,<8.0"
jupyter-book = "*"
jupytext = ">=1.14,<2.0"
pylint = "*"
pytest = "*"
pytest-cov = "*"
pyyaml = "*"
packaging = "*"
readthedocs-sphinx-ext = "*"
sphinx = ">=5.0,<6.0"
nbconvert = "~7.16.4"

# Build dependencies
poetry-core = ">=1.8.0"
poetry-dynamic-versioning = ">=1.9.1,<2.0"
markupsafe = ">=2.0"
dunamai = ">=1.25,<2.0"
tomlkit = ">=0.13"

[feature.dev.tasks]
postinstall = "pixi run install-dev && pip install --no-deps git+https://github.com/MiraGeoscience/geoh5py.git@develop && pip install --no-deps git+https://github.com/MiraGeoscience/grid-apps.git@develop && pip install --no-deps git+https://github.com/MiraGeoscience/geoapps-utils.git@develop && pip install --no-deps git+https://github.com/MiraGeoscience/simpeg.git@develop"

[environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
