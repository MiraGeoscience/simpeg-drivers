schema_version: 1

context:
  name: "simpeg-drivers"
  python_min: "3.12"
  # Extract version from auto-generated _version.json
  version: "${{ load_from_file('_version.json').version | trim }}"
  module_name: ${{ name|lower|replace("-", "_") }}

package:
  name: ${{ name|lower }}
  version: "${{ version }}"

source:
  path: ../${{ name }}

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.8.0
    - poetry-dynamic-versioning >=1.9, 1.*
  run:
    - python >=${{ python_min }}
    # Mira packages
    - geoapps-utils >=0.7.0a2, 0.7.*
    - geoh5py >=0.13.0a2, 0.13.*
    - grid-apps >=0.2.0a2, 0.2.*
    - mira-simpeg >=0.23.0.2, 0.23.0.* | >=0.25.0.1a, 0.25.0.*

    # direct dependencies
    - dask-core 2025.3.*
    - discretize 0.12.*
    - distributed 2025.3.*
    - matplotlib-base >=3.10.4, 3.10.*
    - numpy >=2.4.2, 2.4.*
    - openpyxl >=3.1.2, 3.*
    - pandas >=2.2.1, 3.*
    - pydantic 2.12.*
    - pydiso 0.2.*
    - python-mumps 0.0.6.*
    - rtree 1.4.*
    - scikit-learn 1.8.*
    - scipy 1.17.*
    - tqdm >=4.66.1, 4.*
    - trimesh >=4.1.3, 4.1.*
    # constrain version for some indirect dependencies from SimPEG
    - geoana 0.8.*
    - pymatsolver 0.3.*
    - zarr >=2.14.2, 2.14.*
  run_constraints:
    - __glibc >=2.17
    - bokeh 3.6.*
    - fsspec >=2022.0

tests:
  - python:
      imports:
        - ${{ module_name }}
        - ${{ module_name }}._version
        - dask
        - distributed
        - geoapps_utils
        - geoh5py
        - grid_apps
        - simpeg
      pip_check: true

  - script:
      - pytest --ignore=tests/version_test.py --ignore=tests/run_tests --ignore=tests/plate_simulation
    requirements:
      run:
        - pytest
    files:
      source:
        - tests/

  - package_contents:
      files:
        - site-packages/${{ module_name }}/_version.py

about:
  license: MIT
  license_file:
    - LICENSE
    - docs/THIRD_PARTY_SOFTWARE.rst
  homepage: https://www.mirageoscience.com/mining-industry-software/python-integration/
  repository: https://github.com/MiraGeoscience/simpeg-drivers
  documentation: https://mirageoscience-simpeg-drivers.readthedocs-hosted.com/

extra:
  recipe-maintainers:
    - andrewg-mira
    - domfournier
    - sebhmg
