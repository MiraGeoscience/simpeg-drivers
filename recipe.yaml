schema_version: 1

context:
  name: "simpeg-drivers"
  python_min: "3.12"
  # Extract version from auto-generated _version.json
  version: "${{ load_from_file('_version.json').version | trim }}"
  module_name: ${{ name|lower|replace("-", "_") }}

package:
  name: ${{ name|lower }}
  version: "${{ version }}"

source:
  path: ../${{ name }}

build:
  number: 0
  noarch: python
  script:
    env:
      POETRY_DYNAMIC_VERSIONING_BYPASS: "${{ version }}"
    content:
      ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=2.2.1
    - poetry-dynamic-versioning >=1.9, 1.*
  run:
    - python >=${{ python_min }}, <3.15.0a.dev
    # Mira packages
    - geoapps-utils >=0.8.0b1, 0.8.*
    - geoh5py >=0.14.0b1, 0.14.*
    - grid-apps >=0.3.0b1, 0.3.*
    - mira-simpeg >=0.26.0.1b1, 0.26.0.*

    # other direct dependencies
    - bokeh 3.6.*
    - dask-core 2026.1.*
    - discretize 0.12.*
    - distributed 2026.1.*  # GHSA-c336-7962-wfj2
    - h5py >=3.15.1, 3.15.*
    - matplotlib-base >=3.10.4, 3.10.*
    - numpy >=2.4.2, 2.4.*
    - openpyxl >=3.1.2, 3.*
    - pandas >=2.3.3, 2.*
    - pydantic 2.12.*
    - pydiso >=0.3.1, 0.3.*
    - python-mumps 0.0.6.*
    - rtree 1.4.*
    - scikit-learn 1.8.*
    - scipy 1.17.*
    - tqdm >=4.66.1, 4.*
    - trimesh >=4.1.3, 4.*
  run_constraints:
    - __glibc >=2.17
    - geoana 0.8.*
    - psutil >=7.2.2, 7.2.*
    - pymatsolver 0.3.*
    - zarr >=2.14.2, 2.14.*
    # Legacy compatibility minimum, not a security fix; Mira SimPEG requires >=0.3.3.
    - fsspec >=2022.0
    # Security floors for transitive dependencies:
    - certifi >=2026.10.18  # GHSA-6q48-6c7w-9gw2
    - msgpack-python >=1.2.3  # GHSA-j586-36cw-2gc2
    - pillow >=13.0.0  # GHSA-wqgw-9xfh-qf2g
    - setuptools >=84.1.0  # GHSA-xmj3-9gf7-h52w
    - tornado >=6.6.1  # GHSA-5cjw-f85j-cv6r
    - urllib3 >=2.8.0  # GHSA-gh4c-6fx4-qh6g
    - werkzeug >=3.1.9  # GHSA-g6x2-hccm-hh4m

tests:
  - python:
      python_version: ${{ python_min }}.*
      imports:
        - ${{ module_name }}
        - ${{ module_name }}._version
        - dask
        - distributed
        - geoapps_utils
        - geoh5py
        - grid_apps
        - simpeg

  - script:
      - pytest --ignore=tests/version_test.py --ignore=tests/pixi_lock_test.py --ignore=tests/run_tests --ignore=tests/plate_simulation
    requirements:
      run:
        - pytest
    files:
      source:
        - tests/

  - package_contents:
      files:
        - site-packages/${{ module_name }}/_version.py

about:
  license: MIT
  license_file:
    - LICENSE
    - docs/THIRD_PARTY_SOFTWARE.md
  homepage: https://www.mirageoscience.com/mining-industry-software/python-integration/
  repository: https://github.com/MiraGeoscience/simpeg-drivers
  documentation: https://mirageoscience-simpeg-drivers.readthedocs-hosted.com/

extra:
  recipe-maintainers:
    - andrewg-mira
    - domfournier
    - RomFloreani
    - sebhmg
