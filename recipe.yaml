schema_version: 1

context:
  name: "simpeg-drivers"
  version: "0.0.0.dev0"  # This will be replaced by the actual version in the build process
  python_min: "3.10"
  module_name: ${{ name|lower|replace("-", "_") }}

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  path: ../${{ name }}

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python 3.10.*
    - poetry-core >=1.8.0
    - poetry-dynamic-versioning >=1.9, 1.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    # Mira packages
    - geoapps-utils >=0.7.0a, 0.7.*
    - geoh5py >=0.13.0a, 0.13.*
    - grid-apps >=0.2.0a, 0.2.*
    - mira-simpeg >=0.23.0.3a, 0.23.0.*

    # direct dependencies
    - dask-core 2025.3.*
    - discretize 0.11.*
    - distributed 2025.3.*
    - numpy 1.26.*
    - pydantic >=2.12.0, 2.*
    - pydiso 0.1.*
    - python-mumps >=0.0.3, 0.0.3.*
    - rtree 1.2.*
    - scikit-learn 1.6.*
    - scipy 1.14.*
    - tqdm >=4.66.1, 4.*
    - trimesh >=4.1.3, 4.1.*
    # constrain version for some indirect dependencies from SimPEG
    - geoana 0.7.*
    - matplotlib-base >=3.8.4, 3.9.*
    - pymatsolver 0.3.*
    - zarr >=2.14.2, 2.14.*
  run_constraints:
    - __glibc >=2.17
    - bokeh 3.6.*
    - fsspec >=2022.0

tests:
  - python:
      imports:
        - ${{ module_name }}
        - ${{ module_name }}._version
        - dask
        - distributed
        - geoapps_utils
        - geoh5py
        - grid_apps
        - simpeg
      pip_check: true

  - script:
      - pytest --ignore=tests/version_test.py
    requirements:
      run:
        - pytest
    files:
      source:
        - tests/

  - package_contents:
      files:
        - site-packages/${{ module_name }}/_version.py

about:
  license: MIT
  license_file:
    - LICENSE
    - docs/THIRD_PARTY_SOFTWARE.rst
  homepage: https://www.mirageoscience.com/mining-industry-software/python-integration/
  repository: https://github.com/MiraGeoscience/simpeg-drivers
  documentation: https://mirageoscience-simpeg-drivers.readthedocs-hosted.com/

extra:
  recipe-maintainers:
    - andrewg-mira
    - domfournier
    - sebhmg
