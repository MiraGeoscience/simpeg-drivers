schema_version: 1

context:
  name: "simpeg-drivers"
  version: "0.0.0.dev0"  # This will be replaced by the actual version in the build process
  python_min: "3.10"
  module_name: ${{ name|lower|replace("-", "_") }}

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  path: ../${{ name }}

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python 3.10.*
    - poetry-core >=1.8.0
    - poetry-dynamic-versioning >=1.9, <2.0.dev
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    # Mira packages
    - geoapps-utils >=0.6.0b2, <0.7.dev
    - geoh5py >=0.12.0b4, <0.13.dev
    - grid-apps >=0.1.0b1, <0.2.dev
    - mira-simpeg >=0.23.0.2b1, <0.23.1.dev

    # direct dependencies
    - dask-core >=2025.3, <2025.4.dev
    - discretize >=0.11.0, <0.12.dev
    - distributed >=2025.3, <2025.4.dev
    - numpy >=1.26.0, <1.27.dev
    - pydantic >=2.5.2, <3.0.dev
    - pydiso >=0.1.0, <0.2.dev
    - python-mumps >=0.0.3, <0.0.4.dev
    - rtree >=1.2.0, <1.3.dev
    - scikit-learn >=1.6.0, <1.7.dev
    - scipy >=1.14.0, <1.15.dev
    - tqdm >=4.66.1, <5.0.dev
    - trimesh >=4.1.3, <4.2.dev
    # constrain version for some indirect dependencies from SimPEG
    - geoana >=0.7.0, <0.8.dev
    - matplotlib-base >=3.8.4, <3.9.dev
    - pymatsolver >=0.3.0, <0.4.dev
    - zarr >=2.14.2, <2.15.dev
  run_constraints:
    - __glibc >=2.17
    - bokeh >=3.6.0, <3.7.dev
    - fsspec >=2022.0

tests:
  - python:
      imports:
        - ${{ module_name }}
        - ${{ module_name }}._version
        - dask
        - distributed
        - geoapps_utils
        - geoh5py
        - grid_apps
        - simpeg
      pip_check: true

  - script:
      - pytest --ignore=tests/version_test.py
    requirements:
      run:
        - pytest
    files:
      source:
        - tests/

  - package_contents:
      files:
        - site-packages/${{ module_name }}/_version.py

about:
  license: MIT
  license_file:
    - LICENSE
    - docs/THIRD_PARTY_SOFTWARE.rst
  homepage: https://www.mirageoscience.com/mining-industry-software/python-integration/
  repository: https://github.com/MiraGeoscience/simpeg-drivers
  documentation: https://mirageoscience-simpeg-drivers.readthedocs-hosted.com/

extra:
  recipe-maintainers:
    - andrewg-mira
    - domfournier
    - sebhmg
