version: 2

build:
  os: "ubuntu-24.04"
  tools:
    python: "3.14"
  apt_packages:
    - git-lfs
  jobs:
    post_system_dependencies:
      - git lfs install --local
      - git lfs pull
    create_environment:
      - asdf plugin add pixi
      - asdf install pixi 0.84.2
      - asdf global pixi 0.84.2
      - pixi install --locked --environment docs
    build:
      html:
        - pixi run --frozen --environment docs build-docs html "$READTHEDOCS_OUTPUT"
    post_build:
      - mkdir -p "$READTHEDOCS_OUTPUT/htmlzip"
      - cd "$READTHEDOCS_OUTPUT/html" && zip -r ../htmlzip/simpeg-drivers-docs.zip .
